services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basit-ai-interview-app
    restart: always
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - NODE_ENV=production
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basit-loop-orchestrator
    restart: always
    command: ["python3", "basit_loop_orchestrator.py"]
    depends_on:
      - app
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
